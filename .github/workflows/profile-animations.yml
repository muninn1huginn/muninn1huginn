
name: Generate Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-3d:
    name: Generate 3D Contribution Calendar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate 3D Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit 3D Calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "Update 3D contribution calendar"
            git push
          fi

  generate-fx:
    name: Generate Ripple & Equalizer
    runs-on: ubuntu-latest

    steps:
      - name: Generate Contribution FX
        uses: Sur1ive/contribution-fx@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-ripple.svg?theme=ripple&palette=purple
            dist/contribution-ripple-dark.svg?theme=ripple&palette=purple&mode=dark
            dist/contribution-equalizer.svg?theme=equalizer&palette=ocean
            dist/contribution-equalizer-dark.svg?theme=equalizer&palette=ocean&mode=dark

      - name: Publish SVGs
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
