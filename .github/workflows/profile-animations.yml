
name: Generate Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-3d:
    name: Generate 3D Contribution Calendar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Generate 3D Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Verify Generated SVGs
        run: |
          echo "Checking generated files..."

          if [ ! -s profile-3d-contrib/profile-night-view.svg ]; then
            echo "::error::3D calendar SVG was not generated!"
            echo "Contents of repository:"
            ls -la
            echo "Contents of profile-3d-contrib:"
            ls -la profile-3d-contrib/ || true
            exit 1
          fi

          echo "3D calendar generated successfully!"
          ls -lh profile-3d-contrib/

      - name: Commit 3D Calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A profile-3d-contrib/

          if ! git diff --cached --quiet; then
            git commit -m "Update 3D contribution calendar"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "3D calendar successfully pushed!"
          else
            echo "No changes to commit."
          fi

  generate-fx:
    name: Generate Ripple & Equalizer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Contribution FX
        uses: Sur1ive/contribution-fx@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-ripple.svg?theme=ripple&palette=purple
            dist/contribution-ripple-dark.svg?theme=ripple&palette=purple&mode=dark
            dist/contribution-equalizer.svg?theme=equalizer&palette=ocean
            dist/contribution-equalizer-dark.svg?theme=equalizer&palette=ocean&mode=dark

      - name: Verify Generated SVGs
        run: |
          echo "Checking Contribution FX files..."
          ls -lh dist/
          test -s dist/contribution-ripple.svg
          test -s dist/contribution-equalizer.svg
          echo "Contribution FX generated successfully!"

      - name: Publish SVGs
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
